<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Daily 1-on-1 Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9; --white: #ffffff; --dark: #0f172a; --surface: #1e293b;
  --orange: #f97316; --muted: #64748b; --border: #e2e8f0;
  --green: #16a34a; --yellow: #d97706; --red: #dc2626; --blue: #0891b2;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Barlow',sans-serif; background:var(--bg); color:var(--dark); padding:32px; font-size:14px; }
.page-header { background:var(--surface); border-radius:12px; padding:24px 32px; display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
.page-header img { height:48px; }
.header-center { text-align:center; }
.page-header-title { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:900; color:white; text-transform:uppercase; letter-spacing:2px; }
.page-header-date { font-size:13px; color:#94a3b8; font-weight:500; margin-top:4px; }
.print-btn { padding:10px 20px; background:var(--orange); color:white; border:none; border-radius:6px; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.print-btn:disabled { opacity:0.4; cursor:not-allowed; }
.controls { background:var(--white); border-radius:10px; border:1px solid var(--border); padding:20px 24px; margin-bottom:24px; display:flex; align-items:flex-end; gap:16px; }
.selector-label { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:6px; }
.selector-dropdown { width:260px; padding:10px 14px; border:1px solid var(--border); border-radius:6px; font-family:'Barlow',sans-serif; font-size:14px; font-weight:500; color:var(--dark); background:var(--white); cursor:pointer; outline:none; }
.selector-dropdown:focus { border-color:var(--orange); }
.reset-btn { padding:10px 20px; background:var(--bg); color:var(--muted); border:1px solid var(--border); border-radius:6px; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.reset-btn:not(:disabled):hover { background:var(--border); color:var(--dark); }
.reset-btn:disabled { opacity:0.4; cursor:not-allowed; }
.empty-state { background:var(--white); border-radius:12px; border:1px solid var(--border); padding:80px 40px; text-align:center; }
.empty-logo { margin-bottom:20px; }
.empty-logo img { height:72px; opacity:0.2; }
.empty-state-text { font-size:16px; color:var(--muted); font-weight:500; }
.hca-card { background:var(--white); border-radius:10px; border:1px solid var(--border); overflow:hidden; max-width:720px; margin:0 auto; }
.brief-header { background:var(--surface); padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
.brief-name { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:white; }
.brief-pts { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:900; color:var(--orange); }
.brief-stats { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--border); }
.brief-stat { padding:16px; text-align:center; border-right:1px solid var(--border); }
.brief-stat:last-child { border-right:none; }
.stat-val { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:800; line-height:1; }
.stat-lbl { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.5px; text-transform:uppercase; margin-top:4px; }
.green{color:var(--green);} .yellow{color:var(--yellow);} .red{color:var(--red);} .orange{color:var(--orange);}
.brief-leads { padding:16px 24px; }
.leads-title { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.lead-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f8fafc; }
.lead-row:last-child { border-bottom:none; }
.urgency-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.dot-green{background:var(--green);} .dot-yellow{background:var(--yellow);} .dot-orange{background:#f97316;} .dot-red{background:var(--red);} .dot-black{background:#374151;}
.lead-name { flex:1; font-weight:500; font-size:13px; }
.lead-meta { display:flex; gap:16px; align-items:center; }
.lead-days { font-size:12px; color:var(--muted); font-weight:600; min-width:34px; text-align:right; }
.lead-amount { font-size:13px; font-weight:700; color:var(--dark); min-width:72px; text-align:right; }
.lead-phone { font-size:12px; color:var(--blue); min-width:112px; text-align:right; }
.brief-talking { background:#f8fafc; border-top:1px solid var(--border); padding:16px 24px; }
.talking-title { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.talking-point { font-size:13px; color:var(--dark); line-height:1.6; padding:4px 0 4px 14px; position:relative; }
.talking-point::before { content:'→'; position:absolute; left:0; color:var(--orange); font-weight:700; }
@media print { body{padding:16px;background:white;} .print-btn,.controls{display:none;} .hca-card{max-width:100%;} }
</style>
</head>
<body>

<div class="page-header">
  <img src="https://cmheating.github.io/sales-tools/cm-logo.webp" alt="CM Heating">
  <div class="header-center">
    <div class="page-header-title">Daily 1-on-1 Brief</div>
    <div class="page-header-date" id="dateLabel"></div>
  </div>
  <button class="print-btn" id="printBtn" onclick="window.print()" disabled>⎙ Print / PDF</button>
</div>

<div class="controls">
  <div>
    <div class="selector-label">Select HCA</div>
    <select class="selector-dropdown" id="hcaSelect" onchange="selectHCA(this.value)">
      <option value="">-- Choose an HCA --</option>
      <option value="Amber">Amber Maddalena</option>
      <option value="Chester">Chester Granard</option>
      <option value="Davis">Davis Diosdado</option>
      <option value="Jay">Javierre Milo</option>
      <option value="Joe">Joe Chounramany</option>
      <option value="Joseph">Joseph Ruble</option>
      <option value="Kyle">Kyle McAlister</option>
      <option value="Samir">Samir Khoury</option>
      <option value="Trevor">Trevor Bohm</option>
    </select>
  </div>
  <button class="reset-btn" id="resetBtn" onclick="resetView()" disabled>Reset</button>
</div>

<div id="emptyState" class="empty-state">
  <div class="empty-logo">
    <img src="https://cmheating.github.io/sales-tools/cm-logo.webp" alt="CM Heating">
  </div>
  <div class="empty-state-text">Select an HCA to view their brief</div>
</div>

<div id="cardContainer" style="display:none"></div>

<script>

  new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

const briefData = {

    {name:'Zia Qadir',        days:124,amount:'$33,213',phone:'(206) 739-6075',urgency:'black'},
    {name:'Elena Lau',        days:120,amount:'$10,105',phone:'(425) 501-7713',urgency:'black'},
    {name:'Quality Inn',      days:119,amount:'$8,371', phone:'(253) 441-1255',urgency:'black'},
  ], talking:[
    'Zia Qadir at $33K — 124 days, Unreachable status, is this worth continuing?',
    'Good balance of attempts (35) and conv rate (40%) — solid overall performance',
    'Fewest open leads (33) on team — is pipeline being built or leads dismissed early?',
  ]},

    {name:'Shawn Pate',          days:454,amount:'$27,101',phone:'(734) 730-1389',urgency:'black'},
    {name:'Ellis Strandell',     days:125,amount:'$0',     phone:'(425) 923-8008',urgency:'black'},
    {name:'Kasidee Youngblut',   days:122,amount:'$23,205',phone:'(425) 387-5588',urgency:'black'},
    {name:'John and Carla Baker',days:120,amount:'$9,681', phone:'(425) 220-4226',urgency:'black'},

    'Shawn Pate at 454 days — this needs to be dismissed, it is not a real lead anymore',
    'Conv rate 38% with high activity — quality of approach may need a refresh, not more volume',
  ]},
  Davis:   { conv:45, attempts:3, pipeline:'$631K', pts:4530, leads:[
    {name:'Michelle Petelle',       days:124,amount:'$22,526',phone:'(253) 651-3080',urgency:'black'},
    {name:'Mike Meiers Icon Dental',days:116,amount:'$19,201',phone:'(206) 999-7056',urgency:'black'},
    {name:'William Paige',          days:116,amount:'$5,262', phone:'(480) 215-4304',urgency:'black'},
    {name:'Megan Kile',             days:115,amount:'$19,277',phone:'(509) 528-7759',urgency:'black'},
  ], talking:[
    'Best conv rate on team at 45% — acknowledge, but 3 attempts on $631K pipeline is a problem',
    '38 open leads with almost no follow-up — what is blocking the calls?',
    'Michelle Petelle at 124 days — should have been closed or cut 90 days ago',
  ]},
  Jay:     { conv:40, attempts:18, pipeline:'$840K', pts:4180, leads:[
    {name:'Behuailu Tafese',   days:144,amount:'$15,924',phone:'(206) 512-0653',urgency:'black'},
    {name:'Eljo George',       days:126,amount:'$15,080',phone:'(408) 309-4999',urgency:'black'},
    {name:'Amanda Helfer',     days:118,amount:'$18,446',phone:'(206) 773-8053',urgency:'black'},
    {name:'Rushali Khandelwal',days:118,amount:'$7,067', phone:'(518) 954-5361',urgency:'black'},
  ], talking:[
    'Behuailu Tafese at 144 days — longest open lead, what is the real status?',
    '18 attempts on 55 leads — good activity, acknowledge and push to increase',
    '$840K pipeline is strong — connect follow-up frequency directly to close rate',
  ]},
  Joe:     { conv:45, attempts:1, pipeline:'$810K', pts:4210, leads:[
    {name:'Joshua Henderson',        days:124,amount:'$5,792', phone:'(360) 941-4540',urgency:'black'},
    {name:'Ron Barrow',              days:122,amount:'$14,940',phone:'(425) 777-6465',urgency:'black'},
    {name:'Ronald Schlupp',          days:119,amount:'$22,413',phone:'(360) 421-6821',urgency:'black'},
    {name:'Edmonds United Methodist',days:118,amount:'$77,418',phone:'(425) 300-2751',urgency:'black'},
  ], talking:[
    'Edmonds United Methodist at $77K — highest single value open lead on the team, only 1 attempt',
    '45% conv rate is outstanding — what is stopping follow-up activity?',
    '1 attempt on $810K pipeline — direct conversation needed today',
  ]},
  Joseph:  { conv:42, attempts:2, pipeline:'$1.17M', pts:4420, leads:[
    {name:'Mike Horner',                  days:125,amount:'$25,176',phone:'(425) 844-9252',urgency:'black'},
    {name:'Mukilteo Presbyterian Church', days:125,amount:'$36,523',phone:'(425) 275-7312',urgency:'black'},
    {name:'Mike Schireman',               days:125,amount:'$12,655',phone:'(425) 231-3737',urgency:'black'},
    {name:'Rolf Rupp and Tina Ding',      days:119,amount:'$25,842',phone:'(425) 268-9136',urgency:'black'},
  ], talking:[
    '$1.17M pipeline — largest on team — with only 2 follow-up attempts. Biggest coaching moment',
    'Mukilteo Presbyterian at $36K — commercial job, needs dedicated follow-up plan',
    '61 open leads is unsustainable — need a close/cut audit on anything 60+ days old',
  ]},
  Kyle:    { conv:44, attempts:17, pipeline:'$839K', pts:4870, leads:[
    {name:'Ola Fademisin',      days:265,amount:'$9,849', phone:'(206) 313-1645',urgency:'black'},
    {name:'Genevieve Matteson', days:252,amount:'$27,045',phone:'(425) 478-9954',urgency:'black'},
    {name:'Immanuel Lutheran',  days:172,amount:'$35,651',phone:'(425) 252-9547',urgency:'black'},
    {name:'Sushant Mudholkar',  days:133,amount:'$7,957', phone:'(425) 233-2739',urgency:'black'},
  ], talking:[
    'Ola Fademisin (265d) and Genevieve Matteson (252d) — close or cut, no room to carry these',
    'Immanuel Lutheran at $35K — high value commercial, what is the status?',
    '17 attempts is solid — keep the activity up, conv rate rewards it',
  ]},
  Samir:   { conv:38, attempts:23, pipeline:'$775K', pts:3330, leads:[
    {name:'Cara Decarlow',   days:125,amount:'$7,949', phone:'(541) 646-1445',urgency:'black'},
    {name:'Stacey Drimmer',  days:122,amount:'$19,811',phone:'(206) 999-8639',urgency:'black'},
    {name:'David Carrell',   days:122,amount:'$25,950',phone:'(206) 719-7340',urgency:'black'},
    {name:'David Carrell (2)',days:122,amount:'$24,121',phone:'(206) 719-7340',urgency:'black'},
  ], talking:[
    'David Carrell has two open opportunities at $50K combined — consolidate into one conversation',
    '23 attempts on 49 leads — activity is there, focus on quality of each touch',
    'Conv rate 38% — review objection patterns, is there a common theme?',
  ]},
  Trevor:  { conv:40, attempts:28, pipeline:'$398K', pts:2580, leads:[
    {name:'SOLD HOME',     days:423,amount:'$23,350',phone:'—',             urgency:'black'},
    {name:'Avinit Mohanty',days:77, amount:'$26,547',phone:'(737) 999-1577',urgency:'black'},
    {name:'Diane Smith',   days:76, amount:'$15,303',phone:'(425) 404-0778',urgency:'black'},
    {name:'Chris Chen',    days:66, amount:'$24,637',phone:'(503) 432-6570',urgency:'black'},
  ], talking:[
    '"SOLD HOME" at 423 days — flag for ServiceTitan cleanup, property sold, close this out',
    'Smallest open pipeline ($398K) — is Trevor being aggressive enough on new consults?',
    '28 attempts is strong relative to 20 open leads — good follow-up discipline',
  ]},
};

function getConvColor(v){ return v>=42?'green':v>=38?'yellow':'red'; }
function getAttColor(v) { return v>=20?'green':v>=10?'yellow':'red'; }

function selectHCA(name) {
  if(!name) return;
  const d = briefData[name];
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resetBtn').disabled = false;
  document.getElementById('printBtn').disabled = false;
  document.getElementById('cardContainer').style.display = 'block';
  document.getElementById('cardContainer').innerHTML = `
    <div class="hca-card">
      <div class="brief-header">
        <div class="brief-name">${name}</div>
        <div class="brief-pts">${d.pts.toLocaleString()} pts</div>
      </div>
      <div class="brief-stats">
        <div class="brief-stat"><div class="stat-val ${getConvColor(d.conv)}">${d.conv}%</div><div class="stat-lbl">Conv Rate</div></div>
        <div class="brief-stat"><div class="stat-val ${getAttColor(d.attempts)}">${d.attempts}</div><div class="stat-lbl">Attempts</div></div>
        <div class="brief-stat"><div class="stat-val orange">${d.pipeline}</div><div class="stat-lbl">Pipeline</div></div>
      </div>
      <div class="brief-leads">
        <div class="leads-title">Oldest Open Leads</div>
        ${d.leads.map(l=>`
          <div class="lead-row">
            <div class="urgency-dot dot-${l.urgency}"></div>
            <div class="lead-name">${l.name}</div>
            <div class="lead-meta">
              <div class="lead-days">${l.days}d</div>
              <div class="lead-amount">${l.amount}</div>
              <div class="lead-phone">${l.phone}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="brief-talking">
        <div class="talking-title">Talking Points</div>
        ${d.talking.map(t=>`<div class="talking-point">${t}</div>`).join('')}
      </div>
    </div>`;
}

function resetView() {
  document.getElementById('hcaSelect').value = '';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('cardContainer').style.display = 'none';
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('printBtn').disabled = true;
}
</script>
</body>
</html>
