<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Sales Operations System Overview</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9;
  --white: #ffffff;
  --dark: #0f172a;
  --surface: #1e293b;
  --orange: #f97316;
  --muted: #64748b;
  --border: #e2e8f0;
  --green: #16a34a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--dark);
  padding: 40px;
  max-width: 960px;
  margin: 0 auto;
  font-size: 14px;
  line-height: 1.6;
}
.header {
  background: var(--surface);
  border-radius: 12px;
  padding: 32px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 36px;
}
.header img { height: 56px; }
.header-text h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 30px;
  font-weight: 900;
  color: white;
  text-transform: uppercase;
  letter-spacing: 2px;
  line-height: 1;
}
.header-text p {
  font-size: 13px;
  color: #94a3b8;
  margin-top: 6px;
  font-weight: 500;
}
.print-btn {
  padding: 10px 20px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}
.intro {
  background: white;
  border-radius: 10px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--orange);
  padding: 24px 28px;
  margin-bottom: 28px;
  font-size: 15px;
  color: var(--dark);
  line-height: 1.7;
}
.tools-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.tool-card {
  background: white;
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.tool-header {
  background: var(--surface);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.tool-icon { font-size: 22px; }
.tool-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: white;
}
.tool-body { padding: 18px 20px; }
.tool-desc {
  font-size: 13px;
  color: var(--dark);
  margin-bottom: 12px;
  line-height: 1.6;
}
.tool-link {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  color: var(--orange);
  text-decoration: none;
  border: 1px solid var(--orange);
  border-radius: 4px;
  padding: 4px 10px;
}
.tool-bullets {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tool-bullet {
  font-size: 12px;
  color: var(--muted);
  padding-left: 14px;
  position: relative;
}
.tool-bullet::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--orange);
  font-weight: 700;
}
.section {
  background: white;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
  overflow: hidden;
}
.section-header {
  background: var(--surface);
  padding: 14px 20px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: white;
}
.section-body { padding: 20px 24px; }
.workflow-steps {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.step {
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.step-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--orange);
  min-width: 28px;
  line-height: 1.3;
}
.step-text { font-size: 13px; line-height: 1.6; }
.step-text strong { color: var(--dark); }

/* URL BUTTONS */
.url-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.url-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  background: var(--surface);
  border-radius: 8px;
  text-decoration: none;
  transition: background 0.15s, transform 0.1s;
  border: 1px solid transparent;
}
.url-btn:hover {
  background: #2d3f55;
  border-color: var(--orange);
  transform: translateY(-1px);
}
.url-btn-icon {
  font-size: 22px;
  flex-shrink: 0;
}
.url-btn-text {}
.url-btn-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: white;
  line-height: 1.2;
}
.url-btn-sub {
  font-size: 11px;
  color: var(--orange);
  font-weight: 500;
  margin-top: 2px;
}
.url-btn-arrow {
  margin-left: auto;
  font-size: 18px;
  color: var(--orange);
  font-weight: 700;
}

.timing-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.timing-card {
  background: var(--bg);
  border-radius: 6px;
  border: 1px solid var(--border);
  padding: 14px;
  text-align: center;
}
.timing-day {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--orange);
  line-height: 1;
  margin-bottom: 6px;
}
.timing-action {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}
.footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
@media print {
  body { padding: 20px; background: white; }
  .print-btn { display: none; }
  .tools-grid { grid-template-columns: repeat(2, 1fr); }
  .url-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
