<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Heating — Joe Chounramany Follow-Up Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9;--white:#fff;--dark:#0f172a;--surface:#1e293b;
  --orange:#f97316;--muted:#64748b;--border:#e2e8f0;
  --green:#16a34a;--yellow:#d97706;--red:#dc2626;--blue:#0891b2;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--dark);padding:28px;font-size:14px;}
.header{background:var(--surface);border-radius:12px;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.header img{height:48px;}
.header-mid h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:white;text-transform:uppercase;letter-spacing:2px;line-height:1;}
.header-mid p{font-size:12px;color:#94a3b8;margin-top:4px;}
.print-btn{padding:9px 18px;background:var(--orange);color:white;border:none;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.tile{background:white;border-radius:8px;border:1px solid var(--border);border-left:3px solid var(--orange);padding:14px;text-align:center;}
.tile-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:var(--orange);line-height:1;}
.tile-lbl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-top:4px;}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-btn{padding:7px 16px;border:1px solid var(--border);border-radius:6px;background:white;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;}
.filter-btn.active{background:var(--surface);color:white;border-color:var(--surface);}
.lead-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;align-self:center;}
.leads{display:flex;flex-direction:column;gap:12px;}
.lead-card{background:white;border-radius:10px;border:1px solid var(--border);border-left:4px solid #94a3b8;overflow:hidden;}
.lead-card[data-urgency="fresh"]{border-left-color:var(--green);}
.lead-card[data-urgency="warm"]{border-left-color:var(--yellow);}
.lead-card[data-urgency="hot"]{border-left-color:var(--orange);}
.lead-card[data-urgency="critical"]{border-left-color:var(--red);}
.lead-card[data-urgency="dead"]{border-left-color:#1e293b;}
.lead-header{display:flex;align-items:center;gap:12px;padding:14px 18px;}
.urgency-bar{width:4px;height:40px;border-radius:2px;flex-shrink:0;}
.urgency-fresh{background:var(--green);}
.urgency-warm{background:var(--yellow);}
.urgency-hot{background:var(--orange);}
.urgency-critical{background:var(--red);}
.urgency-dead{background:#1e293b;}
.lead-name{flex:1;font-weight:700;font-size:15px;}
.lead-days{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;min-width:56px;text-align:right;}
.days-fresh{color:var(--green);}
.days-warm{color:var(--yellow);}
.days-hot{color:var(--orange);}
.days-critical{color:var(--red);}
.days-dead{color:#1e293b;}
.days-lbl{font-size:10px;color:var(--muted);text-align:right;font-weight:600;}
.lead-meta{display:flex;gap:16px;padding:0 18px 10px;flex-wrap:wrap;}
.meta-item{font-size:12px;color:var(--muted);}
.meta-item strong{color:var(--dark);font-weight:600;}
.lead-actions{padding:12px 18px;border-top:1px solid var(--bg);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.status-select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:'Barlow',sans-serif;background:white;color:var(--dark);}
.notes-input{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:'Barlow',sans-serif;resize:vertical;min-height:36px;}
.save-btn{padding:7px 16px;background:var(--surface);color:white;border:none;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.save-btn:hover{background:var(--orange);}
.st-banner{display:none;background:#fef3c7;border:1px solid #fcd34d;border-radius:6px;padding:8px 12px;margin:0 18px 12px;font-size:12px;color:#92400e;align-items:center;gap:10px;}
.copy-btn{padding:4px 12px;background:#92400e;color:white;border:none;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.copy-btn.copied{background:var(--green);}
.prior-section{border-top:1px solid var(--bg);}
.prior-toggle{width:100%;padding:9px 18px;background:none;border:none;text-align:left;cursor:pointer;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.prior-toggle:hover{color:var(--dark);}
.prior-badge{background:var(--orange);color:white;font-size:10px;padding:1px 6px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.prior-content{padding:10px 18px 14px;display:none;}
.prior-entry{font-size:12px;color:var(--dark);line-height:1.6;padding:6px 0;border-bottom:1px solid #f8fafc;}
.prior-entry:last-child{border-bottom:none;}
.prior-entry .entry-time{font-size:11px;color:var(--muted);font-weight:600;}
@media print{.print-btn,.filters,.lead-actions,.prior-toggle{display:none!important;}body{padding:16px;}}
</style>
</head>

function urgencyClass(d){
  if(d<=3) return 'fresh';
  if(d<=7) return 'warm';
  if(d<=20) return 'hot';
  if(d<=30) return 'critical';
  return 'dead';
}

document.getElementById('dateLabel').textContent =
  'Week of ' + new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

// Count filters
function updateCounts(){
  document.getElementById('cnt-all').textContent = '('+leads.length+')';
  document.getElementById('cnt-critical').textContent = '('+leads.filter(l=>l.daysOld>=21).length+')';
  document.getElementById('cnt-hot').textContent = '('+leads.filter(l=>l.daysOld>=8&&l.daysOld<=20).length+')';
  document.getElementById('cnt-fresh').textContent = '('+leads.filter(l=>l.daysOld<=7).length+')';
}

function renderLeads(filtered){
  const container = document.getElementById('leadsContainer');
  container.innerHTML = '';
  document.getElementById('showingCount').textContent = 'Showing '+filtered.length+' of '+leads.length;
  filtered.forEach((lead,idx)=>{
    const urg = urgencyClass(lead.daysOld);
    const hasPrior = lead.priorNotes && lead.priorNotes.trim().length > 0;
    const priorHtml = hasPrior
      ? `<div class="prior-section">
           <button class="prior-toggle" onclick="togglePrior(${idx})">
             ▶ Prior Notes <span class="prior-badge" id="badge-${idx}">1</span>
           </button>
           <div class="prior-content" id="prior-${idx}">
             <div class="prior-entry"><div class="entry-time">ServiceTitan history</div>${lead.priorNotes}</div>
           </div>
         </div>`
      : '';

    const nfuHtml = lead.nextFollowUp
      ? `<div class="meta-item">📅 Next F/U: <strong>${lead.nextFollowUp}</strong></div>` : '';

    container.innerHTML += `
      <div class="lead-card" data-urgency="${urg}" data-idx="${idx}" id="card-${idx}">
        <div class="lead-header">
          <div class="urgency-bar urgency-${urg}"></div>
          <div class="lead-name">${lead.customer}</div>
          <div>
            <div class="lead-days days-${urg}">${lead.daysOld}d</div>
            <div class="days-lbl">days old</div>
          </div>
        </div>
        <div class="lead-meta">
          <div class="meta-item">💰 <strong>${lead.estimate}</strong></div>
          <div class="meta-item">📞 <strong>${lead.phone}</strong></div>
          <div class="meta-item">📍 ${lead.address}</div>
          <div class="meta-item">Status: <strong>${lead.status}</strong></div>
          <div class="meta-item">Last F/U: <strong>${lead.lastFollowUp}</strong></div>
          ${nfuHtml}
          <div class="meta-item">Attempts: <strong>${lead.followUps}</strong></div>
          <div class="meta-item">Created: <strong>${lead.createdOn}</strong></div>
        </div>
        <div class="lead-actions">
          <select class="status-select" id="status-${idx}">
            <option value="Contacted" ${lead.status==='Contacted'?'selected':''}>Contacted</option>
            <option value="Unreachable" ${lead.status==='Unreachable'?'selected':''}>Unreachable</option>
            <option value="NotAttempted" ${lead.status==='NotAttempted'?'selected':''}>Not Attempted</option>
            <option value="Dismissed">Dismissed</option>
            <option value="Sold">✓ Sold</option>
          </select>
          <textarea class="notes-input" id="notes-${idx}" placeholder="What happened? (required to save)"></textarea>
          <button class="save-btn" onclick="saveFollowUp(${idx})">Log Follow-Up</button>
        </div>
        <div class="st-banner" id="banner-${idx}">
          <span>📋 Paste into ServiceTitan:</span>
          <span id="banner-text-${idx}" style="flex:1;font-weight:600;"></span>
          <button class="copy-btn" id="copy-btn-${idx}" onclick="copyNote(${idx})">Copy</button>
        </div>
        ${priorHtml}
      </div>`;
  });
}

function filterLeads(type, btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  let filtered;
  if(type==='all') filtered = leads;
  else if(type==='critical') filtered = leads.filter(l=>l.daysOld>=21);
  else if(type==='hot') filtered = leads.filter(l=>l.daysOld>=8&&l.daysOld<=20);
  else if(type==='fresh') filtered = leads.filter(l=>l.daysOld<=7);
  renderLeads(filtered);
}

function togglePrior(idx){
  const el = document.getElementById('prior-'+idx);
  const btn = el.previousElementSibling;
  if(el.style.display==='block'){
    el.style.display='none'; btn.textContent=btn.textContent.replace('▼','▶');
  } else {
    el.style.display='block'; btn.innerHTML=btn.innerHTML.replace('▶','▼');
  }
}

function saveFollowUp(idx){
  const lead = leads[idx];
  const status = document.getElementById('status-'+idx).value;
  const notes = document.getElementById('notes-'+idx).value.trim();
  if(!notes){ alert('Please enter notes before saving.'); return; }

  const now = new Date();
  const ts = now.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'})
    + ', ' + now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  const noteText = '['+ts+'] Status: '+status+' | '+notes;

  const btn = document.querySelector('#card-'+idx+' .save-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;

  const params = new URLSearchParams({
    customer: lead.customer, status, notes: noteText, hca: HCA
  });

  fetch(SCRIPT_URL+'?'+params.toString())
    .then(()=>{
      btn.textContent = '✓ Saved!'; btn.style.background = 'var(--green)';
      // ST banner
      const banner = document.getElementById('banner-'+idx);
      document.getElementById('banner-text-'+idx).textContent = noteText;
      banner.style.display = 'flex';
      // Prepend to prior notes
      const priorEl = document.getElementById('prior-'+idx);
      if(priorEl){
        priorEl.innerHTML = '<div class="prior-entry"><div class="entry-time">'+ts+'</div>'+notes+'</div>' + priorEl.innerHTML;
        priorEl.style.display = 'block';
      } else {
        const card = document.getElementById('card-'+idx);
        const priorSection = document.createElement('div');
        priorSection.className = 'prior-section';
        priorSection.innerHTML = `<button class="prior-toggle" onclick="togglePrior(${idx})">▼ Prior Notes <span class="prior-badge" id="badge-${idx}">1</span></button>
          <div class="prior-content" id="prior-${idx}" style="display:block"><div class="prior-entry"><div class="entry-time">${ts}</div>${notes}</div></div>`;
        card.appendChild(priorSection);
      }
      document.getElementById('notes-'+idx).value = '';
      setTimeout(()=>{ btn.textContent='Log Follow-Up'; btn.style.background=''; btn.disabled=false; }, 3000);
    })
    .catch(()=>{
      btn.textContent='Error — Retry'; btn.style.background='var(--red)'; btn.disabled=false;
    });
}

function copyNote(idx){
  const text = document.getElementById('banner-text-'+idx).textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById('copy-btn-'+idx);
    btn.textContent='✓ Copied!'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('copied'); }, 2500);
  });
}

updateCounts();
renderLeads(leads);
</script>
